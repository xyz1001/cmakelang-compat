[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cmakelang-compat"
version = "0.1.0a1"
description = "Local compatibility support for cmakelang on newer Python runtimes"
requires-python = ">=3.9"
license = "GPL-3.0-only"
readme = "README.md"
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3"]

[project.urls]
Repository = "https://github.com/xyz1001/cmakelang-compat"
Issues = "https://github.com/xyz1001/cmakelang-compat/issues"

[project.optional-dependencies]
test = ["cmakelang[YAML]==0.6.13"]

[tool.hatch.build.targets.wheel]
packages = ["src/cmakelang_compat"]

[tool.hatch.build.targets.wheel.force-include]
"cmakelang_compat.start" = "cmakelang_compat.start"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/cmakelang_compat.start", "/README.md", "/RELEASING.md", "/LICENSE", "/pyproject.toml"]
